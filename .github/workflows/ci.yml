name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    env:
      # Throwaway CI-only values: the build must succeed without real credentials, and the
      # bundle-secrets step proves none of these server values reach .next/static.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-only-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPPORT_EMAIL: soporte@ejemplo.test
      SUPABASE_SECRET_KEY: sb_secret_ci-only-placeholder-value-0000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '54325'
      SMTP_USER: ci
      SMTP_PASS: ci-only-smtp-password-0000
      EMAIL_FROM: 'Creando Valor IA <no-responder@ejemplo.test>'
      RATE_LIMIT_PEPPER: ci-only-pepper-0000000000000000000000
      SEND_EMAIL_HOOK_SECRET: v1,whsec_Y2ktb25seS1zZWNyZXQtY2ktb25seS1zZWNyZXQtY2k=
      GOOGLE_GENERATIVE_AI_API_KEY: AIzaCiOnlyPlaceholderValue000000000000000
      PRACTICE_DISPATCH_SECRET: ci-only-practice-dispatch-secret-00000000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: bundle-secrets
        run: pnpm check:bundle-secrets

  db:
    runs-on: ubuntu-latest
    env:
      SITE_URL: http://localhost:3000
      SEND_EMAIL_HOOK_URI: http://host.docker.internal:3000/api/auth/send-email
      # Throwaway CI-only secret (local stack, never used outside the runner)
      SEND_EMAIL_HOOK_SECRET: v1,whsec_Y2ktb25seS1zZWNyZXQtY2ktb25seS1zZWNyZXQtY2k=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start -x studio,imgproxy,vector,logflare,supavisor
      - run: pnpm supabase db reset
      - run: pnpm supabase test db

  # End-to-end (Playwright + axe) against the local Supabase stack and a production build.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env: &app-env
      CI: 'true'
      SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPPORT_EMAIL: soporte@ejemplo.test
      SEND_EMAIL_HOOK_URI: http://host.docker.internal:3000/api/auth/send-email
      # Throwaway CI-only values (local stack inside the runner, never used elsewhere)
      SEND_EMAIL_HOOK_SECRET: v1,whsec_Y2ktb25seS1zZWNyZXQtY2ktb25seS1zZWNyZXQtY2k=
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '54325'
      EMAIL_FROM: 'Creando Valor IA <no-responder@ejemplo.test>'
      RATE_LIMIT_PEPPER: ci-only-pepper-0000000000000000000000
      E2E_EMAIL_FAIL_DOMAIN: falla-envio.test
      # 002: deterministic fake AI provider (no Gemini calls, no real ai_usage cost) and the local
      # dispatcher secret stored in Vault by supabase/seed.sql.
      AI_PROVIDER: fake
      PRACTICE_DISPATCH_SECRET: local-dev-practice-dispatch-secret-0000000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start -x studio,imgproxy,vector,logflare,supavisor
      - run: pnpm supabase db reset
      - name: Export local Supabase keys
        run: |
          eval "$(pnpm -s supabase status -o env)"
          echo "::add-mask::$SECRET_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "MAILPIT_URL=$MAILPIT_URL"
          } >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      # playwright.config.ts builds and starts the app (webServer) before the tests.
      - run: pnpm test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Lighthouse CI, mobile profile: landing, /iniciar-sesion and /inicio with the seeded seller (SC-007/008).
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: *app-env
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start -x studio,imgproxy,vector,logflare,supavisor
      - run: pnpm supabase db reset
      - name: Export local Supabase keys
        run: |
          eval "$(pnpm -s supabase status -o env)"
          echo "::add-mask::$SECRET_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
          } >> "$GITHUB_ENV"
      - run: pnpm build
      - name: Start the app
        run: |
          pnpm start > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && exit 0; sleep 2; done
          cat next.log; exit 1
      - run: pnpm lhci
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 14
